name: CodeQL

# Análisis de seguridad y calidad de GitHub sobre el código Kotlin/Java del proyecto.
# No necesita la ROM: analiza NUESTRO código, nunca material de Nintendo.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # lunes por la mañana, como el informe de deuda

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: Analizar (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Compilación manual: solo :core, que no necesita el Android SDK. Así el análisis
      # es rápido y no depende de que el runner traiga SDK de Android.
      - name: Compilar :core
        run: ./gradlew :core:compileKotlin --console=plain

      - name: Ejecutar el análisis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
