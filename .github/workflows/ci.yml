name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Permite lanzar el CI a mano desde la pestaña Actions (auditorías, re-runs).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Tests del motor (:core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests de core
        run: ./gradlew :core:test --console=plain

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-core
          path: core/build/reports/tests/test

  mutation-tests:
    name: Mutación de :core (¿los tests detectan código roto?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pitest muta el código de core y re-ejecuta la suite: los mutantes
      # supervivientes señalan tests que pasan aunque el código esté roto.
      - name: Ejecutar pitest
        run: ./gradlew :core:pitest --console=plain

      - name: Resumen de mutación
        if: always()
        run: |
          if [ -f core/build/reports/pitest/mutations.xml ]; then
            total=$(grep -o '<mutation ' core/build/reports/pitest/mutations.xml | wc -l)
            killed=$(grep -o "status='KILLED'" core/build/reports/pitest/mutations.xml | wc -l)
            echo "### Mutación de :core" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes generados: $total" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes cazados: $killed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Supervivientes (agujeros de la suite): $((total - killed))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar informe de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mutacion-core
          path: core/build/reports/pitest

  app-build:
    name: Compilar APK (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest trae el Android SDK preinstalado (ANDROID_HOME),
      # así que settings.gradle.kts activa el módulo :app automáticamente.
      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release rodante con enlace de descarga estable (solo en esta rama).
      - name: Preparar APK con nombre
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr'
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-debug.apk

      - name: Actualizar release rodante (apk-latest)
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente (debug)
          prerelease: true
          body: APK de depuración compilada automáticamente a partir del último push de la rama.
          files: role-builder-debug.apk
