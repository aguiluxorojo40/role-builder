name: CI

on:
  push:
    branches: ["**"]
    # Escuchamos TODAS las etiquetas, no solo v*, para poder AVISAR cuando
    # alguien empuja uno que parece una versión pero no publicará nada.
    # Antes el filtro era v* y una etiqueta mal escrita no disparaba el
    # workflow: ni error ni release, solo silencio (ver job "etiqueta").
    tags: ["*"]
  pull_request:
  # Permite lanzar el CI a mano desde la pestaña Actions (auditorías, re-runs).
  workflow_dispatch:

permissions:
  contents: write
  security-events: write # subir el SARIF de detekt a Code Scanning

jobs:
  # Una etiqueta mal nombrada no publica release. Sin este job eso ocurría en
  # SILENCIO —ni error, ni aviso, solo una release sin APK—, que es la peor
  # forma de fallar: te enteras diez minutos después mirando una lista vacía.
  etiqueta:
    name: Nombre de la etiqueta
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que publicará lo que crees
        run: |
          T='${{ github.ref_name }}'
          case "$T" in
            apk-latest|apk-snes-latest)
              echo "::warning::'$T' es una etiqueta rodante HISTÓRICA: los releases rodantes se retiraron y ya no se publica nada bajo ese nombre. El APK sale de las etiquetas de versión (v0.13.0, ...)."
              exit 0 ;;
            v[0-9]*)
              echo "Etiqueta de versión correcta: $T"; exit 0 ;;
            V[0-9]*)
              echo "::warning::La etiqueta '$T' lleva la V en MAYÚSCULA. Publicará igual, pero las demás del repo son minúsculas (v0.10.0, v0.9.2...) y el orden por versión se rompe. Suele ser la autocapitalización del teclado del móvil: escribe primero el número y añade la 'v' al principio después."
              exit 0 ;;
          esac
          if printf '%s' "$T" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "::error::La etiqueta '$T' parece una versión pero NO va a publicar ninguna release: le falta la 'v' inicial."
            echo "::error::Las etiquetas de versión se llaman v<MAYOR>.<MENOR>.<PARCHE> en minúscula. Para esta: v$T"
            echo "::error::Bórrala y vuelve a crearla con el nombre correcto; si no, la release se queda sin APK."
            exit 1
          fi
          echo "Etiqueta sin relación con versiones ($T): no se publica nada."

  core-tests:
    name: Tests del motor (:core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ejecutar tests de core (con cobertura)
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :core:test :core:koverXmlReport :core:koverHtmlReport --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-core
          path: core/build/reports/tests/test

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-cobertura-core
          path: core/build/reports/kover/html

      - name: Resumen de cobertura
        if: always()
        run: |
          REPORT=core/build/reports/kover/report.xml
          [ -f "$REPORT" ] || { echo "Sin informe de cobertura." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$REPORT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("## Cobertura de :core\n")
          print("| Métrica | Cubierto | Total | % |")
          print("|---|---:|---:|---:|")
          for c in root.findall("counter"):
              cov, mis = int(c.get("covered", 0)), int(c.get("missed", 0))
              tot = cov + mis
              pct = f"{100*cov/tot:.1f}%" if tot else "-"
              print(f"| {c.get('type').title()} | {cov} | {tot} | {pct} |")
          PY

  mutation-tests:
    name: Mutación de :core (¿los tests detectan código roto?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # Pitest muta el código de core y re-ejecuta la suite: los mutantes
      # supervivientes señalan tests que pasan aunque el código esté roto.
      - name: Ejecutar pitest
        run: ./gradlew :core:pitest --console=plain

      - name: Resumen de mutación
        if: always()
        run: |
          if [ -f core/build/reports/pitest/mutations.xml ]; then
            total=$(grep -o '<mutation ' core/build/reports/pitest/mutations.xml | wc -l)
            killed=$(grep -o "status='KILLED'" core/build/reports/pitest/mutations.xml | wc -l)
            echo "### Mutación de :core" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes generados: $total" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes cazados: $killed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Supervivientes (agujeros de la suite): $((total - killed))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar informe de mutación
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-mutacion-core
          path: core/build/reports/pitest

  analisis-estatico:
    name: Análisis estático (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # La baseline (config/detekt/baseline.xml) tiene la deuda YA existente, así que
      # esto solo se pone rojo con problemas NUEVOS.
      - name: Ejecutar detekt
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :core:detekt --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Subir SARIF a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: core/build/reports/detekt/detekt.sarif
          category: detekt

      - name: Publicar informe de detekt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-detekt
          path: core/build/reports/detekt

  app-build:
    name: Compilar APK (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      # ubuntu-latest trae el Android SDK preinstalado (ANDROID_HOME),
      # así que settings.gradle.kts activa el módulo :app automáticamente.
      - name: Tests del módulo :app (JVM, sin emulador)
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :app:testDebugUnitTest --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Compilar APK de depuración
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :app:assembleDebug --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: role-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Aquí hubo un "release rodante" (apk-latest) que se sobrescribía en cada
      # push a main. Se retiró a propósito: una descarga que cambia bajo el
      # mismo enlace no dice qué versión es, y con el APK de cada versión
      # publicado abajo ya no hacía falta. Para probar un commit suelto está el
      # artefacto del workflow, que se sube en CUALQUIER rama (paso anterior).

      # Release de versión CONGELADA: el único APK publicado. Se dispara al
      # empujar una etiqueta v* (los nombres en clave están en CHANGELOG.md):
      #     git tag v0.13.0 && git push origin v0.13.0
      - name: Preparar APK de versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-${{ github.ref_name }}-debug.apk

      - name: Publicar release de versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Role Builder ${{ github.ref_name }}
          body: |
            APK de la versión `${{ github.ref_name }}`, compilada desde el commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Detalle de esta versión en el [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: role-builder-${{ github.ref_name }}-debug.apk
