name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  core-tests:
    name: Tests del motor (:core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests de core
        run: ./gradlew :core:test --console=plain

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-core
          path: core/build/reports/tests/test

  app-build:
    name: Compilar APK (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest trae el Android SDK preinstalado (ANDROID_HOME),
      # así que settings.gradle.kts activa el módulo :app automáticamente.
      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release rodante con enlace de descarga estable. La rama principal publica
      # en 'apk-latest'; las ramas del extractor de SNES publican en
      # 'apk-snes-latest' para no pisar la anterior.
      - name: Preparar APK con nombre
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr' || github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc'
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-debug.apk

      - name: Actualizar release rodante
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr' || github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc') && 'apk-snes-latest' || 'apk-latest' }}
          name: ${{ (github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy') && 'APK con extractor de SNES (debug)' || 'APK más reciente (debug)' }}
          prerelease: true
          body: APK de depuración compilada automáticamente a partir del último push de la rama.
          files: role-builder-debug.apk
