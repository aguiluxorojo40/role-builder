name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write
  security-events: write # subir el SARIF de detekt a Code Scanning

jobs:
  core-tests:
    name: Tests del motor (:core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests de core (con cobertura)
        run: ./gradlew :core:test :core:koverXmlReport :core:koverHtmlReport --console=plain

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-core
          path: core/build/reports/tests/test

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cobertura-core
          path: core/build/reports/kover/html

      - name: Resumen de cobertura
        if: always()
        run: |
          REPORT=core/build/reports/kover/report.xml
          [ -f "$REPORT" ] || { echo "Sin informe de cobertura." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$REPORT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("## Cobertura de :core\n")
          print("| Métrica | Cubierto | Total | % |")
          print("|---|---:|---:|---:|")
          for c in root.findall("counter"):
              cov, mis = int(c.get("covered", 0)), int(c.get("missed", 0))
              tot = cov + mis
              pct = f"{100*cov/tot:.1f}%" if tot else "-"
              print(f"| {c.get('type').title()} | {cov} | {tot} | {pct} |")
          PY

  analisis-estatico:
    name: Análisis estático (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # La baseline (config/detekt/baseline.xml) tiene la deuda YA existente, así que
      # esto solo se pone rojo con problemas NUEVOS.
      - name: Ejecutar detekt
        run: ./gradlew :core:detekt --console=plain

      - name: Subir SARIF a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: core/build/reports/detekt/detekt.sarif
          category: detekt

      - name: Publicar informe de detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-detekt
          path: core/build/reports/detekt

  app-build:
    name: Compilar APK (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest trae el Android SDK preinstalado (ANDROID_HOME),
      # así que settings.gradle.kts activa el módulo :app automáticamente.
      - name: Tests del módulo :app (JVM, sin emulador)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release rodante con enlace de descarga estable. La rama principal publica
      # en 'apk-latest'; las ramas del extractor de SNES publican en
      # 'apk-snes-latest' para no pisar la anterior.
      - name: Leer versión de la app
        id: appver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Preparar APK con nombre
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr' || github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc'
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-debug.apk

      - name: Actualizar release rodante
        if: github.ref_name == 'claude/android-rpg-engine-jsrssr' || github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.ref_name == 'claude/snes-asset-extraction-htsbch' || github.ref_name == 'claude/snes-sprite-color-automation-3x51fa' || github.ref_name == 'claude/snes-sprite-color-automation-59ybqy' || github.ref_name == 'claude/snes-sprite-color-automation-918asc') && 'apk-snes-latest' || 'apk-latest' }}
          name: Role Builder ${{ steps.appver.outputs.name }} — APK de depuración
          prerelease: true
          body: |
            APK de depuración compilada automáticamente desde el último push de la rama `${{ github.ref_name }}`.

            **Versión:** ${{ steps.appver.outputs.name }} · commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            Detalle de novedades en el [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: role-builder-debug.apk
