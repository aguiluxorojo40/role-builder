name: CI

on:
  push:
    branches: ["**"]
    # Empujar una etiqueta v* congela una release de versión con su APK.
    tags: ["v*"]
  pull_request:
  # Permite lanzar el CI a mano desde la pestaña Actions (auditorías, re-runs).
  workflow_dispatch:

permissions:
  contents: write
  security-events: write # subir el SARIF de detekt a Code Scanning

jobs:
  core-tests:
    name: Tests del motor (:core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar tests de core (con cobertura)
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :core:test :core:koverXmlReport :core:koverHtmlReport --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Publicar informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-core
          path: core/build/reports/tests/test

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-cobertura-core
          path: core/build/reports/kover/html

      - name: Resumen de cobertura
        if: always()
        run: |
          REPORT=core/build/reports/kover/report.xml
          [ -f "$REPORT" ] || { echo "Sin informe de cobertura." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$REPORT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("## Cobertura de :core\n")
          print("| Métrica | Cubierto | Total | % |")
          print("|---|---:|---:|---:|")
          for c in root.findall("counter"):
              cov, mis = int(c.get("covered", 0)), int(c.get("missed", 0))
              tot = cov + mis
              pct = f"{100*cov/tot:.1f}%" if tot else "-"
              print(f"| {c.get('type').title()} | {cov} | {tot} | {pct} |")
          PY

  mutation-tests:
    name: Mutación de :core (¿los tests detectan código roto?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pitest muta el código de core y re-ejecuta la suite: los mutantes
      # supervivientes señalan tests que pasan aunque el código esté roto.
      - name: Ejecutar pitest
        run: ./gradlew :core:pitest --console=plain

      - name: Resumen de mutación
        if: always()
        run: |
          if [ -f core/build/reports/pitest/mutations.xml ]; then
            total=$(grep -o '<mutation ' core/build/reports/pitest/mutations.xml | wc -l)
            killed=$(grep -o "status='KILLED'" core/build/reports/pitest/mutations.xml | wc -l)
            echo "### Mutación de :core" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes generados: $total" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mutantes cazados: $killed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Supervivientes (agujeros de la suite): $((total - killed))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar informe de mutación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mutacion-core
          path: core/build/reports/pitest

  analisis-estatico:
    name: Análisis estático (detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # La baseline (config/detekt/baseline.xml) tiene la deuda YA existente, así que
      # esto solo se pone rojo con problemas NUEVOS.
      - name: Ejecutar detekt
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :core:detekt --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Subir SARIF a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: core/build/reports/detekt/detekt.sarif
          category: detekt

      - name: Publicar informe de detekt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-detekt
          path: core/build/reports/detekt

  app-build:
    name: Compilar APK (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest trae el Android SDK preinstalado (ANDROID_HOME),
      # así que settings.gradle.kts activa el módulo :app automáticamente.
      - name: Tests del módulo :app (JVM, sin emulador)
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :app:testDebugUnitTest --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Compilar APK de depuración
        run: |
          # Maven Central devuelve 429 (Too Many Requests) de vez en cuando y tumba la
          # resolucion de dependencias. No es un fallo del codigo, asi que se reintenta
          # con espera creciente en vez de dejar el CI en rojo por la infraestructura.
          for intento in 1 2 3; do
            ./gradlew :app:assembleDebug --console=plain && exit 0
            echo "Intento $intento fallido; reintento en $((intento * 20))s"
            sleep $((intento * 20))
          done
          exit 1

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release rodante con enlace de descarga estable: 'apk-latest' siempre
      # apunta a la última compilación de 'main'.
      - name: Leer versión de la app
        id: appver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Preparar APK con nombre
        if: github.ref_name == 'main'
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-debug.apk

      - name: Actualizar release rodante
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Role Builder ${{ steps.appver.outputs.name }} — APK de depuración
          prerelease: true
          body: |
            APK de depuración compilada automáticamente desde el último push de la rama `${{ github.ref_name }}`.

            **Versión:** ${{ steps.appver.outputs.name }} · commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            Detalle de novedades en el [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: role-builder-debug.apk

      # Release de versión CONGELADA. 'apk-latest' se sobrescribe en cada push a
      # main; esto, en cambio, deja un APK fijo por versión. Se dispara al
      # empujar una etiqueta v* (los nombres en clave están en CHANGELOG.md):
      #     git tag v0.13.0 && git push origin v0.13.0
      - name: Preparar APK de versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk role-builder-${{ github.ref_name }}-debug.apk

      - name: Publicar release de versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Role Builder ${{ github.ref_name }}
          body: |
            APK de la versión `${{ github.ref_name }}`, compilada desde el commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            Detalle de esta versión en el [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: role-builder-${{ github.ref_name }}-debug.apk
