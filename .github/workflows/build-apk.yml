name: Compilar APK

on:
  push:
    branches: [claude/android-rpg-engine-phase-4-fymtw6]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del motor
        run: ./gradlew :core:test

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug

      - name: Preparar APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NOMBRE="role-builder-${{ github.ref_name }}-debug.apk"
          else
            NOMBRE="role-builder-debug.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$NOMBRE"
          echo "APK=$NOMBRE" >> "$GITHUB_ENV"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: ${{ env.APK }}

      # Push a la rama: actualiza la release rodante con la última build.
      - name: Actualizar release rodante (apk-latest)
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente (debug)
          prerelease: true
          body: APK de depuración compilada automáticamente a partir del último push de la rama.
          files: ${{ env.APK }}

      # Push de etiqueta v*: release fija de esa versión (nombres en CHANGELOG.md).
      - name: Publicar release de versión
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Role Builder ${{ github.ref_name }}
          body: Ver CHANGELOG.md para el detalle de esta versión.
          files: ${{ env.APK }}
