name: Compilar APK

on:
  push:
    branches: [claude/android-rpg-engine-phase-4-fymtw6]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del motor
        run: ./gradlew :core:test

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug

      - name: Leer versión del proyecto
        run: |
          VERSION=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk role-builder-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "role-builder-v${VERSION}-debug.apk"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: role-builder-debug-apk
          path: role-builder-debug.apk

      # Release rodante: siempre la última build de la rama, mismo enlace.
      - name: Actualizar release rodante (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK más reciente (debug)
          prerelease: true
          body: APK de depuración compilada automáticamente a partir del último push de la rama.
          files: role-builder-debug.apk

      # Release de la versión actual (crea la etiqueta si no existe). Al subir
      # versionName en el Gradle, la release anterior queda congelada y nace
      # una nueva. Nombres en clave de cada versión: CHANGELOG.md.
      - name: Publicar release de versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Role Builder v${{ env.VERSION }}
          body: Ver CHANGELOG.md para el detalle de esta versión.
          files: role-builder-v${{ env.VERSION }}-debug.apk
