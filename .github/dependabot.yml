version: 2

# Dependabot vigila las dependencias del proyecto y las acciones del workflow.
# Agrupado y mensual para que no genere ruido: esto es un proyecto de una persona,
# no queremos 15 PRs sueltas al mes.
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      kotlin-y-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
      herramientas:
        patterns:
          - "io.gitlab.arturbosch.detekt*"
          - "com.android.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      acciones:
        patterns:
          - "*"
